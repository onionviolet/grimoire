name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: the upstream backlink guard walks the commits this
          # push/PR adds, and needs upstream/main to exempt upstream squash
          # subjects.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify app version
        run: node scripts/verify-release-version.mjs
      # pnpm adds a second YAML document to the lockfile unless
      # devEngines.packageManager.onFail is "ignore". GitHub's dependency graph
      # reads only the first one, so Dependabot would lose every dependency and
      # mark open alerts fixed, with no error anywhere.
      - name: Lockfile stays a single YAML document
        run: test "$(grep -c '^---$' pnpm-lock.yaml)" = 0

      # allowBuilds keeps this off for installs, because a failed build deletes
      # the binary on a Node newer than its prebuilds. Vitest needs it built
      # for CI's Node, and pnpm rebuild honors allowBuilds, so run its script.
      - name: Build better-sqlite3 for the test run
        run: pnpm rebuild:node

      - name: Lint
        run: pnpm lint

      # Design-system ratchet: files may not gain raw hex, raw palette colors,
      # focus:ring, white/N tints or em-dashes beyond scripts/ui-baseline.json.
      - name: UI conventions
        run: pnpm ui:check

      - name: Typecheck
        run: pnpm exec tsc -b --noEmit

      - name: Locker artwork covers the full roster
        run: pnpm locker-art:check

      # Vitest covers the FeModel parser, cloth fit math + solver stability,
      # Source 2 / NPR material reconstruction, the dynamic-scalar evaluator and
      # the profiles vpkIndex resolver. Nothing gated these until now, so a PR
      # could break every one of them and still go green.
      - name: Test
        run: |
          pnpm exec vitest run
          node --test scripts/nightly-version.test.mjs

      # Every referenced t()/Tx key must exist in the English catalog, and the
      # committed locale manifest (what the app fetches from `main` to populate
      # the language picker) must match the catalogs on disk.
      - name: i18n catalog + manifest
        run: |
          pnpm i18n:check
          node scripts/gen-locale-manifest.mjs --check

      # v1.26.1 shipped 77 cp1252-round-tripped sequences (a middle dot, an
      # ellipsis and an em dash, rendered as mojibake throughout the packaged
      # app). The corruption is invisible in diff review, so gate on it.
      - name: Source encoding
        run: pnpm encoding:check

      - name: Fork engine release contract
        run: pnpm engine-pin:check

      # This repo is the fork. A commit message that writes a bare upstream
      # number or a github.com upstream URL makes GitHub post a reference into
      # Slush97/grimoire's timeline under the pusher's name, and the entry
      # survives any later edit of the text. Local hooks cover the normal path;
      # this covers pushes made with --no-verify or from another machine.
      - name: Upstream backlink guard
        run: |
          git remote add upstream https://github.com/Slush97/grimoire.git || true
          git fetch --quiet --no-tags upstream main || true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --quiet --no-tags origin "${{ github.base_ref }}"
            range="origin/${{ github.base_ref }}..HEAD"
          elif [ -n "${{ github.event.before }}" ] && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            range="HEAD~1..HEAD"
          fi
          echo "checking $range"
          node scripts/check-upstream-refs.mjs --range "$range"

      # The prod-build gate refuses to build without GRIMOIRE_SOCIAL_BASE_URL
      # set to an https URL. CI uses a placeholder to exercise the build
      # pipeline; the value is meaningless at runtime (CI doesn't run the app).
      - name: Build
        env:
          GRIMOIRE_SOCIAL_BASE_URL: https://grimoire-social.ci.workers.dev
        run: |
          pnpm exec electron-vite build
          test "$(grep -c 'Could not resolve "' dist/main/index.js)" = 0
